<!doctype html><html><head><meta charset="utf-8"><title>Color depth glyphs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:24px 16px;background:#fafafa;font:12px ui-monospace,Menlo,Consolas,monospace;color:#555}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1200px;margin:auto}
figure{margin:0;background:#fff;border:1px solid #eee;border-radius:16px;padding:16px 10px 10px;text-align:center}
.tile img{width:96px;height:96px} figcaption{margin-top:8px;display:flex;flex-direction:column;gap:3px}
figcaption span{font-size:10px;color:#999;line-height:1.35}</style></head>
<body><main><figure><div class="tile"><img src="gateway-periwinkle-pink.svg" alt=""></div><figcaption><b>gateway-periwinkle-pink</b><span>voice-motif-01 | core linear 180deg @below | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="gateway-indigo-dusk.svg" alt=""></div><figcaption><b>gateway-indigo-dusk</b><span>gateway-arch | core linear 180deg @above +echo | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="saffron-luminous.svg" alt=""></div><figcaption><b>saffron-luminous</b><span>voice-motif-02 | core radial @center | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="forest-gold.svg" alt=""></div><figcaption><b>forest-gold</b><span>model-04 | core linear 180deg @below | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="sky-white.svg" alt=""></div><figcaption><b>sky-white</b><span>model-03 | core linear 180deg @below | rim white</span></figcaption></figure>
<figure><div class="tile"><img src="rose-shadow.svg" alt=""></div><figcaption><b>rose-shadow</b><span>model-11 | core linear 180deg @above | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="leaf-sky.svg" alt=""></div><figcaption><b>leaf-sky</b><span>voice-motif-03 | core linear 180deg @below | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="sindoor-marigold.svg" alt=""></div><figcaption><b>sindoor-marigold</b><span>model-07 | core linear 180deg @below | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="spectrum-arch.svg" alt=""></div><figcaption><b>spectrum-arch</b><span>gateway-arch | core linear 180deg @below | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="marigold-cream.svg" alt=""></div><figcaption><b>marigold-cream</b><span>model-09 | core radial @below | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="deep-indigo-violet.svg" alt=""></div><figcaption><b>deep-indigo-violet</b><span>model-10 | core linear 180deg @center | rim custom</span></figcaption></figure>
<figure><div class="tile"><img src="blush-coral.svg" alt=""></div><figcaption><b>blush-coral</b><span>model-01 | core linear 180deg @above | rim custom</span></figcaption></figure></main></body></html>
